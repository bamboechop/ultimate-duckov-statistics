name: CI

on:
  push:
    branches: [main, codex/m18-release-hardening]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore game-independent projects
        run: dotnet restore .\tests\UltimateDuckovStatistics.Tests\UltimateDuckovStatistics.Tests.csproj
      - name: Test core
        run: dotnet test .\tests\UltimateDuckovStatistics.Tests\UltimateDuckovStatistics.Tests.csproj -c ${{ matrix.configuration }} --no-restore --collect:"XPlat Code Coverage"
      - name: Audit core PE and PDB identities
        run: ./scripts/audit-artifacts.ps1 -InputPaths @('./src/UltimateDuckovStatistics.Core/bin/${{ matrix.configuration }}/netstandard2.1/UltimateDuckovStatistics.Core.dll', './src/UltimateDuckovStatistics.Core/bin/${{ matrix.configuration }}/netstandard2.1/UltimateDuckovStatistics.Core.pdb')
      - name: Build contract probe
        run: dotnet build .\tools\DuckovContractProbe\DuckovContractProbe.csproj -c Release
      - name: Build frame-time analyzer
        run: dotnet build .\tools\FrameTimeAnalyzer\FrameTimeAnalyzer.csproj -c Release

  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject forbidden binaries
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -iname '0Harmony.dll' -o -iname 'TeamSoda.Duckov.Core.dll' -o -iname 'ItemStatsSystem.dll' -o -iname 'Assembly-CSharp.dll' -o -iname 'UnityEngine*.dll' \) -print -quit | grep -q .; then
            echo 'Forbidden game/Harmony binary is present in the repository.' >&2
            exit 1
          fi
